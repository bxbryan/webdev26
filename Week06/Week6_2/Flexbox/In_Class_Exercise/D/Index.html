<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flexbox Layouts</title>
    <!-- https://fonts.google.com/icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
    <h2>Flexbox Layouts</h2>
    <div class="container">
      <div class="item item1">1</div>
      <div class="item item2">2</div>
      <div class="item item3">3</div>
      <div class="item item4">4</div>
      <div class="item item5">5</div>
    </div>


    <h2>justify start, align start</h2>
    <div class="container justify-start align-start">
      <div class="item center">1</div>
      <div class="item center">2</div>
      <div class="item center">3</div>
      <div class="item center">4</div>
      <div class="item center">5</div>
    </div>

    <h2>justify end, align end</h2>
    <div class="container justify-end align-end">
      <div class="item center">1</div>
      <div class="item center">2</div>
      <div class="item center">3</div>
      <div class="item center">4</div>
      <div class="item center">5</div> 
    </div>

    <h2>justify center, align center</h2>
    <div class="container justify-center align-center">
      <div class="item center">1</div>
      <div class="item center">2</div>
      <div class="item center">3</div>
      <div class="item center">4</div>
      <div class="item center">5</div> 
    </div>

    <h2>justify between, align stretch</h2>
    <div class="container justify-between align-stretch">
      <div class="item center">1</div>
      <div class="item center">2</div>
      <div class="item center">3</div>
      <div class="item center">4</div>
      <div class="item center">5</div> 
    </div>

    <h2>justify around, align center</h2>
    <div class="container justify-around align-center">
      <div class="item center">1</div>
      <div class="item center">2</div>
      <div class="item center">3</div>
      <div class="item center">4</div>
      <div class="item center">5</div> 
    </div>

    <h2>justify evenly, align center, align self</h2>
    <div class="container justify-even align-center">
      <div class="item center">1</div>
      <div class="item center align-self">2</div>
      <div class="item center">3</div>
      <div class="item center">4</div>
      <div class="item center">5</div> 
    </div>
  <body></body>
</html>
